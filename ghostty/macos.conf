# macOS-only Ghostty settings (included from config via platform.conf).

theme = light:Rose Pine Dawn,dark:Rose Pine Moon

font-size = 13.5
font-thicken = true
adjust-cell-height = 20%
window-colorspace = display-p3

cursor-color = cell-foreground
cursor-text = cell-background

mouse-scroll-multiplier = 2
copy-on-select = clipboard
macos-option-as-alt = true
shell-integration-features = no-cursor, sudo, no-title

window-padding-x = 5
window-padding-y = 0
window-padding-balance = true
window-save-state = always
quit-after-last-window-closed = true

# Disable split keybindings (using tmux instead)
keybind = super+d=unbind
keybind = super+shift+d=unbind
keybind = super+shift+enter=unbind
keybind = super+[=unbind
keybind = super+]=unbind
keybind = super+ctrl+==unbind

# Match the physical [ ] keys so tab switching also works under a Chinese input
# method, which turns [ ] into 【 】 and misses Ghostty's character-based defaults.
keybind = super+shift+bracket_left=previous_tab
keybind = super+shift+bracket_right=next_tab
