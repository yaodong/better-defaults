# Global mise config (~/.config/mise/config.toml).
# Per-project versions live in each repo's own .mise.toml and override these.
[tools]
claude = "latest"
codex = "latest"
coursier = "2.1.24"
gh = "latest"
java = "openjdk-21.0.2"
node = "26.8.2"
python = "3.12.12"
ruby = "4.0.5"
sbt = "1.9.7"
scala = "2.13.12"

[settings]
# Honor .python-version / .ruby-version files everywhere (replaces pyenv/rbenv).
# Off by default in mise.
idiomatic_version_file_enable_tools = ["python", "ruby"]
# mise is updated by the system package manager (pacman / brew), not self-update.
disable_update_warning = true
# Never download tools implicitly (running a shim, a not-found command, exec,
# or a task). Install explicitly with `mise install` / `mise up`.
auto_install = false
exec_auto_install = false
not_found_auto_install = false
task.run_auto_install = false

[settings.upgrade]
auto_prune = false
