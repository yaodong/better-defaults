# Shared by macOS and Omarchy. Key bindings match Omarchy's tmux.conf
# (Option = Alt on macOS Ghostty), except the prefix: C-Space is left free for
# the input method switcher, and C-b isn't a second prefix so the shell and
# Neovim keep it. Prefix panes use the common vim-style keys (h/j/k/l focus,
# H/J/K/L resize, | and - split), which replace Omarchy's prefix h split and
# K kill-session. Of Omarchy's no-prefix Alt keys, the pane keys (C-M-Arrows,
# C-M-S-Arrows) and M-1..9 (window N) are kept; the rest are left out so those
# Alt keys reach the shell and Neovim (M-Left/Right move by word). Previous/next
# window is M-{ / M-} (Alt+Shift+[ / ]) instead, like Cmd+Shift+[ / ] for Ghostty
# tabs. Each Ghostty tab is its own session, so Omarchy's session switching
# (prefix P/N, M-Up/Down) is left out too.

# Prefix
unbind C-b
set -g prefix C-j
bind -N "Send prefix" C-j send-prefix

# Terminal (Omarchy's settings, with its kitty entry swapped for Ghostty).
# Reset the appended lists first so a reload (prefix q) doesn't duplicate entries.
set -g default-terminal "tmux-256color"
set -su terminal-features
set -su terminal-overrides
set -ag terminal-overrides ",*:RGB"
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-ghostty:extkeys"
set -as terminal-features ",*:clipboard"

# General settings
set -g mouse on
set -g set-titles on
set -g set-titles-string '#W'
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g history-limit 50000
set -g display-time 2000
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
# Name windows after the folder while a shell is idle, and after the program
# otherwise. Omarchy's folder-only names all match when several windows share a
# folder; program-only names show just "zsh" for every idle window.
set -gw automatic-rename on
set -gw automatic-rename-format '#{?#{m/r:^(bash|zsh|fish|sh)$,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}'

# Config and help
bind -N "Reload configuration" q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"
if-shell "command -v omarchy-menu-tmux-keybindings" \
  'bind -N "Show tmux keybindings" ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "omarchy-menu-tmux-keybindings --print | less -R"'

# Vi mode for copy
setw -g mode-keys vi
set -g mode-style "bg=blue,fg=black"
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane controls
bind -N "Split pane vertically" - split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" v split-window -h -c "#{pane_current_path}"
bind -N "Split pane horizontally" | split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" x kill-pane

bind -N "Focus pane left" -n C-M-Left select-pane -L
bind -N "Focus pane right" -n C-M-Right select-pane -R
bind -N "Focus pane up" -n C-M-Up select-pane -U
bind -N "Focus pane down" -n C-M-Down select-pane -D

bind -N "Focus pane left" h select-pane -L
bind -N "Focus pane down" j select-pane -D
bind -N "Focus pane up" k select-pane -U
bind -N "Focus pane right" l select-pane -R

bind -N "Resize pane left" -n C-M-S-Left resize-pane -L 5
bind -N "Resize pane down" -n C-M-S-Down resize-pane -D 5
bind -N "Resize pane up" -n C-M-S-Up resize-pane -U 5
bind -N "Resize pane right" -n C-M-S-Right resize-pane -R 5

bind -N "Resize pane left" -r H resize-pane -L 5
bind -N "Resize pane down" -r J resize-pane -D 5
bind -N "Resize pane up" -r K resize-pane -U 5
bind -N "Resize pane right" -r L resize-pane -R 5

# Window navigation
bind -N "Rename window" r command-prompt -I "#W" "rename-window -- '%%'"
bind -N "Create window" c new-window -c "#{pane_current_path}"

bind -N "Previous window" C-p previous-window
bind -N "Next window" C-n next-window
bind -N "Last window" Tab last-window

bind -N "Switch to window 1" -n M-1 select-window -t 1
bind -N "Switch to window 2" -n M-2 select-window -t 2
bind -N "Switch to window 3" -n M-3 select-window -t 3
bind -N "Switch to window 4" -n M-4 select-window -t 4
bind -N "Switch to window 5" -n M-5 select-window -t 5
bind -N "Switch to window 6" -n M-6 select-window -t 6
bind -N "Switch to window 7" -n M-7 select-window -t 7
bind -N "Switch to window 8" -n M-8 select-window -t 8
bind -N "Switch to window 9" -n M-9 select-window -t 9

bind -N "Previous window" -n 'M-{' select-window -t -1
bind -N "Next window" -n 'M-}' select-window -t +1

# Session controls
bind -N "Rename session" R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Create session" C new-session -c "#{pane_current_path}"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-battery'

# Use text-like Nerd Font battery glyphs without coupling status layout to a theme.
set -g @batt_icon_charge_tier8 "󰁹"
set -g @batt_icon_charge_tier7 "󰂁"
set -g @batt_icon_charge_tier6 "󰁿"
set -g @batt_icon_charge_tier5 "󰁾"
set -g @batt_icon_charge_tier4 "󰁽"
set -g @batt_icon_charge_tier3 "󰁼"
set -g @batt_icon_charge_tier2 "󰁻"
set -g @batt_icon_charge_tier1 "󰁺"
set -g @batt_icon_status_charged "󰚥"
set -g @batt_icon_status_charging "󰂄"
set -g @batt_icon_status_discharging "󰂃"
set -g @batt_icon_status_unknown "󰂑"
set -g @batt_icon_status_attached "󱈑"

# Status bar — uses ANSI-named colors so it follows the terminal theme
# (Ghostty light/dark on macOS, the Omarchy theme on Omarchy). Accent is blue,
# like Omarchy's. window-style/window-active-style are left unset here because
# Omarchy's theme switcher (omarchy-theme-set-tmux) owns them; only the macOS
# block below sets them.
set -g @accent blue
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default,fg=default"
set -g status-left ''
set -g status-left-length 100
set -g status-right-length 150
set -g window-status-format "#[fg=black,bg=brightblack,bold] #I #[fg=brightblack,bg=black,nobold] #W #[default]"
set -g window-status-current-format "#[fg=black,bg=#{@accent},bold] #I #[fg=white,bg=black,nobold] #W #[default]"
set -g window-status-separator " "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
setw -g clock-mode-colour blue

# macOS keeps its own look: cyan accent, dimmed inactive panes, heavy borders
# with a pane label. No Omarchy theme switcher owns window-style here.
if-shell '[ "$(uname)" = Darwin ]' {
  set -g @accent cyan
  set -g mode-style "fg=black,bg=brightwhite"
  set -g pane-active-border-style "fg=cyan,bold"
  set -g message-style "bg=default,fg=cyan"
  set -g message-command-style "bg=default,fg=cyan"
  setw -g clock-mode-colour cyan
  set -g window-style "fg=brightblack,bg=default"
  set -g window-active-style "fg=terminal,bg=terminal"
  set -g pane-border-lines heavy
  set -g pane-border-status bottom
  # Pane number as a badge near the right end of its bottom border, like the
  # window numbers in the status bar: accent for the active pane, gray otherwise.
  set -g pane-border-format "#[align=right] #[fg=black]#[bold]#{?pane_active,#[bg=#{@accent}],#[bg=brightblack]} #P #[default] ━━━"
}

# Nudge Neovim to re-read macOS appearance on focus and session change (macOS only;
# theme-sync is not linked on Omarchy).
set-hook -g client-focus-in "run-shell '[ ! -x ~/.local/bin/theme-sync ] || ~/.local/bin/theme-sync'"
set-hook -g client-session-changed "run-shell '[ ! -x ~/.local/bin/theme-sync ] || ~/.local/bin/theme-sync'"

# Initialize TMUX plugin manager
run '~/.config/tmux/plugins/tpm/tpm'

# Status right (after TPM so battery format strings are available).
# Mode indicators (COPY/PREFIX/ZOOM) come first so they survive narrow widths.
set -g status-right '#[fg=#{@accent}]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack] #[bold]#S#[nobold]#{?#{e|<:#{client_width},120},, · #{battery_icon} #{battery_percentage} · 󰃰 %m/%d %H:%M}'
run '~/.config/tmux/plugins/tmux-battery/battery.tmux'

# Sync Neovim with the current macOS appearance after plugins initialize.
run-shell '[ ! -x ~/.local/bin/theme-sync ] || ~/.local/bin/theme-sync'
